name: JSON writer review validation

on:
  push:
    branches: [validation/json-writer-review-20261116]

permissions:
  contents: read

jobs:
  nested-json-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core package and focused test tools
        run: python -m pip install -e ".[quality]" pytest
      - name: Fetch the exact baseline
        run: git fetch --depth=1 origin efc82474bc990f5872226dca56457536c9a880e9
      - name: Compare original source and cached-path sensitivity
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          source = pathlib.Path("src/datasets/io/json.py")
          revised = source.read_bytes()
          tests = ["tests/io/test_json_schema_paths.py", "tests/io/test_nested_cached_paths.py"]
          try:
              original = subprocess.check_output([
                  "git", "show", "efc82474bc990f5872226dca56457536c9a880e9:src/datasets/io/json.py",
              ])
              needle = b"self._json_field_paths = tuple(get_json_field_paths_from_feature(dataset.features))"
              assert revised.count(needle) == 1
              mutation = revised.replace(needle, b"self._json_field_paths = ()")
              for name, content, cases, failures, count in [
                  ("original", original, tests, 2, 4),
                  ("empty-paths", mutation, tests[1:], 2, 2),
              ]:
                  source.write_bytes(content)
                  result = subprocess.run([
                      sys.executable, "-m", "pytest", "-q", "--confcutdir=tests/io",
                      *cases, f"--junitxml={name}.xml",
                  ])
                  report = ET.parse(f"{name}.xml").getroot()
                  assert result.returncode == 1
                  assert len(report.findall(".//failure")) == failures
                  assert len(report.findall(".//testcase")) == count
                  assert not report.findall(".//error")
          finally:
              source.write_bytes(revised)
      - name: Verify cached schema and nested output for both process modes
        run: >-
          python -m pytest -q --confcutdir=tests/io
          tests/io/test_json_schema_paths.py
          tests/io/test_nested_cached_paths.py
          --junitxml=cached.xml
      - name: Check changed files
        run: |
          ruff check src/datasets/io/json.py tests/io/test_json_schema_paths.py tests/io/test_nested_cached_paths.py
          ruff format --check src/datasets/io/json.py tests/io/test_json_schema_paths.py tests/io/test_nested_cached_paths.py
          git diff --exit-code
          git diff --check
          python --version
          python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nested-json-path-results
          path: |
            original.xml
            empty-paths.xml
            cached.xml
